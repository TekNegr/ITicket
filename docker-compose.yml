services:
  db:
    image: postgres:15.4 # Version stable et récente
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: iticket
    ports:
      - "5432:5432"

  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      - PHP_MEMORY_LIMIT=512M
    depends_on:
      - db

  web:
    image: nginx:1.25.2 # Version stable et récente
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf # Monte nginx.conf dans conf.d
    depends_on:
      - php

  mysql:
    image: mysql:8.0 # Version stable et récente
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_DATABASE: db_ITicket
      MYSQL_USER: root
      MYSQL_PASSWORD: ""
    ports:
      - "3306:3306"

#### Instructions pour l'utilisation de Docker Compose
# 1. Assurez-vous d'avoir Docker et Docker Compose installés sur votre machine.