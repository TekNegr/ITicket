services:
  db:
    image: postgres:15.4
    container_name: iticket_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: iticket
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      - PHP_MEMORY_LIMIT=512M
    depends_on:
      - db

  web:
    image: nginx:1.25.2
    container_name: nginx_laravel
    depends_on:
      - php
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"

volumes:
  postgres_data: